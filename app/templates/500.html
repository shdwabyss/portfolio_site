{% extends "base.html" %}

{% block title %}500 — Ошибка сервера{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center;">
    <h1 style="font-size: clamp(6rem, 15vw, 10rem); font-weight: 800; line-height: 1; color: var(--border); margin: 0; letter-spacing: -0.05em;">500</h1>
    <h2 style="font-size: 1.5rem; font-weight: 600; margin-top: 1rem; color: #fff;">{{ content.error_500_title }}</h2>
    <p style="max-width: 420px; color: #a1a1aa; margin-top: 0.5rem; margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.5;">
        {{ content.error_500_desc }}
    </p>
    <a href="/?lang={{ lang }}" style="display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: #fff; color: #000; padding: 10px 20px; font-size: 0.875rem; font-weight: 500; text-decoration: none; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
        {{ content.btn_back_home }}
    </a>
</div>
{% endblock %}
