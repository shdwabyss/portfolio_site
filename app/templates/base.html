<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{{ content.meta_title }}</title>
    <meta name="description" content="{{ content.meta_desc }}">
    <meta name="robots" content="index, follow">
    
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=1.0.1">
    
    <link rel="manifest" href="{{ url_for('static', path='favicon/site.webmanifest') }}">
    
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='favicon/favicon.ico') }}">
    
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='favicon/favicon-16x16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='favicon/favicon-32x32.png') }}">
    
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='favicon/apple-touch-icon.png') }}">
    
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', path='favicon/android-chrome-192x192.png') }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', path='favicon/android-chrome-512x512.png') }}">
</head>
<body>
    <div class="noise-overlay"></div>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='js/main.js') }}"></script>
</body>
</html>
